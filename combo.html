<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>搭配專區</title>
<style>
:root{--d:#0b5fa5;--m:#2f7fd0;--l:#e6f0fb}
body.f{--d:#a3325c;--m:#d4588a;--l:#fbe3ec}
body{font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Heiti TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:#f5f6f8;color:#1d2733;font-size:18px;line-height:1.5}
header{background:var(--d);color:#fff;padding:10px 14px}header h1{margin:0;font-size:20px}
.stop{font-size:13px;color:#8a4b00;background:#fff4e5;padding:4px 14px}
.card{background:#fff;margin:10px;border-radius:14px;padding:14px;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}.row>span{min-width:4.5em;font-weight:700}
.seg button{font-size:18px;padding:8px 14px;border:2px solid var(--m);background:#fff;color:var(--d);border-radius:10px}
.seg button.on{background:var(--d);color:#fff;border-color:var(--d)}
input{font-size:18px;padding:6px;width:5em;border:2px solid #ccd;border-radius:8px}
.fx{font-size:13px;color:#667}.fx input{font-size:13px;width:4em;padding:2px}
#open{font-size:20px;padding:12px;border-radius:12px;border:0;background:var(--d);color:#fff;width:100%}
.big{background:var(--l);border:3px solid var(--m)}
.big .k{font-size:15px;color:#4a5562}.big .v{font-size:30px;font-weight:800;color:var(--d)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>div{background:#fff;border-radius:10px;padding:8px}
.be{font-size:22px;font-weight:800;text-align:center;margin-top:10px;color:#1e7d3c}
.no{font-size:20px;font-weight:700;color:#b3261e}
details summary{font-size:17px;font-weight:700;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid #e3e8ef;padding:5px 4px;text-align:right}th{background:var(--l)}
tr.hit td{background:#eaf7ee;font-weight:700}
.tabs{display:flex;gap:6px;padding:8px 10px 0}.tabs button{flex:1;font-size:17px;font-weight:700;padding:10px 4px;border:2px solid var(--m);background:#fff;color:var(--d);border-radius:12px 12px 0 0}
.tabs button.on{background:var(--d);color:#fff}
/* v1.43 簡單明瞭：字體一致、細框線、結論放最上面 */
body{font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Heiti TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
.card{box-shadow:none;border:1px solid #e3e8ef;border-radius:12px}
.row{margin:10px 0}.row>span{font-size:15px;color:#4a5562;min-width:4.2em}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{font-size:16px;padding:7px 12px;border:1px solid #cbd5e1;color:#1d2733}.seg button.on{border-color:var(--d)}
input{font-size:17px;border:1px solid #cbd5e1}
.tabs button{border:1px solid #cbd5e1;font-size:16px}
.big{display:flex;flex-direction:column;background:#fff;border:1px solid #e3e8ef;border-top:5px solid var(--d)}
.big .be{order:-2;margin:0 0 10px;padding:8px;border-radius:10px;background:#eaf7ee;font-size:24px}
.big .k{font-size:14px}.big>.k{order:-1}.big>.v{order:-1;font-size:32px;margin-bottom:6px}
.big .no{order:-2}
.grid{gap:8px}.grid>div{background:#f7f9fc;padding:8px 10px;font-size:15px;line-height:1.45}.grid b{white-space:nowrap;font-size:17px}
details summary{padding:4px 0}
table{font-size:14px}th{font-weight:600}

/* v1.43 字體統一：正黑體 */
html,body{font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Heiti TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
input,button,select,textarea,table{font:inherit}
</style></head><body>

 <div class="row"><span>附約</span><div class="seg" id="b_rd"><button data-v="FDE" class="on">FDE 重大傷病</button><button data-v="FDF">FDF 重大疾病</button></div></div>
 <div class="row"><span>附約保額</span><input id="b_rs" type="number" value="3.5" min="1" max="10" step="0.1"> 萬美元</div>
 <div class="row"><span>第幾年<br>拿回</span><div class="seg" id="b_yb"><button data-v="20" class="on">20 年</button><button data-v="25">25 年</button><button data-v="30">30 年</button></div></div>
 <div class="row"><span></span><label style="font-size:16px">其他年份：第 <select id="b_ysel" style="font-size:18px;padding:4px;border:2px solid var(--m);border-radius:8px"></select> 年</label></div>
 <div class="fx">匯率 1 美元＝<input id="b_fx" type="number" value="31" step="0.1"> 台幣</div>
</div>
<div id="b_out"><div class="card" style="text-align:center">載入中…</div></div>
</section>
