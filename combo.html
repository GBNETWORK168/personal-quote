<meta name="robots" content="noindex"><title>搭配專區（試作）癌症險＋PFD</title>
<style>
:root{--d:#0b5fa5;--m:#2f7fd0;--l:#e6f0fb}
body.f{--d:#a3325c;--m:#d4588a;--l:#fbe3ec}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0;background:#f5f6f8;color:#1d2733;font-size:18px;line-height:1.5}
header{background:var(--d);color:#fff;padding:10px 14px}header h1{margin:0;font-size:20px}
.stop{font-size:13px;color:#8a4b00;background:#fff4e5;padding:4px 14px}
.card{background:#fff;margin:10px;border-radius:14px;padding:14px;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}.row>span{min-width:4.5em;font-weight:700}
.seg button{font-size:18px;padding:8px 14px;border:2px solid var(--m);background:#fff;color:var(--d);border-radius:10px}
.seg button.on{background:var(--d);color:#fff;border-color:var(--d)}
input{font-size:18px;padding:6px;width:5em;border:2px solid #ccd;border-radius:8px}
.fx{font-size:13px;color:#667}.fx input{font-size:13px;width:4em;padding:2px}
#open{font-size:20px;padding:12px;border-radius:12px;border:0;background:var(--d);color:#fff;width:100%}
.big{background:var(--l);border:3px solid var(--m)}
.big .k{font-size:15px;color:#4a5562}.big .v{font-size:30px;font-weight:800;color:var(--d)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>div{background:#fff;border-radius:10px;padding:8px}
.be{font-size:22px;font-weight:800;text-align:center;margin-top:10px;color:#1e7d3c}
.no{font-size:20px;font-weight:700;color:#b3261e}
details summary{font-size:17px;font-weight:700;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid #e3e8ef;padding:5px 4px;text-align:right}th{background:var(--l)}
tr.hit td{background:#eaf7ee;font-weight:700}
</style></head><body>
<header><h1>癌症險＋PFD 紅富美好　搭配試算</h1></header>
<div class="stop">CLZ／CLX 10/22 停售（10/23 起不受理新契約）</div>
<div class="card">
 <div class="row"><span>性別</span><div class="seg" id="sexb"><button data-v="1" class="on">男｜CLZ</button><button data-v="2">女｜CLX</button></div></div>
 <div class="row"><span>年齡</span><input id="age" type="number" value="40" min="18" max="60"> 歲</div>
 <div class="row"><span>癌症險</span><input id="clzS" type="number" value="100" min="50" max="300"> 萬</div>
 <div class="row"><span>繳費</span><div class="seg" id="tb"><button data-v="20" class="on">20 年</button><button data-v="10">10 年</button></div></div>
 <div class="row"><span>第幾年<br>拿回</span>第 <select id="ysel" style="font-size:20px;padding:6px;border:2px solid var(--m);border-radius:8px"></select> 年</div>
 <div class="fx">匯率 1 美元＝<input id="fx" type="number" value="31" step="0.1"> 台幣</div>
 <button id="open" type="button" style="margin-top:10px">▶ 開始試算</button>
</div>
<div id="out"></div>
